name: Snapshot boards

# Every 15 minutes (at :07, :22, :37, :52: GitHub drops or delays runs queued on the busy :00/:15 marks): read Decaddance's daily boards from PlayFab and publish them as static
# JSON on GitHub Pages (https://allumbra.github.io/decaddance-boards/), so the app can show
# them to a signed-out player with no login. The files are deployed as a Pages artifact and
# never committed, so only the current snapshot is public.
#
# The title key is the PLAYFAB_SECRET_KEY secret of the snapshot-live environment, whose
# deployment branch policy allows only main. Forks and pull requests never receive it, and
# nothing here runs on pull_request.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-boards
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: snapshot-live
    steps:
      - uses: actions/checkout@v4
      - name: Read the boards
        env:
          PLAYFAB_SECRET_KEY: ${{ secrets.PLAYFAB_SECRET_KEY }}
        run: |
          if [ -z "$PLAYFAB_SECRET_KEY" ]; then
            echo "::error title=No PlayFab key::Set PLAYFAB_SECRET_KEY on the snapshot-live environment (see README.md)."
            exit 1
          fi
          python3 -B snapshot_boards.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
